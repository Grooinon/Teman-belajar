<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk — TemanBelajar Demo</title>
    <meta name="description" content="Masuk ke portal TemanBelajar untuk mengakses jadwal bimbingan dan katalog tutor mahasiswa kampus.">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom Theme Styling -->
    <link rel="stylesheet" href="assets/css/demo.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-tb sticky-top py-2">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="index.html">
                <span class="brand-logo-box">
                    <i class="bi bi-mortarboard-fill fs-5"></i>
                </span>
                <span class="text-dark fs-5 tracking-tight">Teman<span class="text-primary">Belajar</span></span>
            </a>
            <div class="d-flex align-items-center gap-2 ms-auto">
                <a href="index.html" class="btn btn-light btn-sm"><i class="bi bi-arrow-left me-1"></i> Kembali ke Beranda</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1 d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="tb-card p-4 p-md-5 bg-white shadow-lg border-0">
                        <div class="text-center mb-4">
                            <span class="brand-logo-box mb-2" style="width: 48px; height: 48px;">
                                <i class="bi bi-mortarboard-fill fs-4"></i>
                            </span>
                            <h1 class="h4 fw-bold text-dark mt-2 mb-1">Masuk ke TemanBelajar</h1>
                            <p class="text-secondary small mb-0">Platform Bimbingan & Tutor Sebaya Mahasiswa Kampus</p>
                        </div>

                        <!-- 1-Click Demo Logins -->
                        <div class="p-3 bg-light rounded-3 mb-4 border">
                            <span class="small fw-bold text-dark d-block mb-2 text-center">
                                <i class="bi bi-lightning-charge-fill text-warning me-1"></i> Quick Demo Login 1-Klik:
                            </span>
                            <div class="d-grid gap-2">
                                <button type="button" class="btn btn-outline-primary btn-sm text-start py-2 px-3 fw-medium" onclick="demoLogin('student')">
                                    <i class="bi bi-mortarboard me-2"></i> Mahasiswa: <strong>Ananda Putra Utama</strong> <small class="text-muted">(20240050086)</small>
                                </button>
                                <button type="button" class="btn btn-outline-success btn-sm text-start py-2 px-3 fw-medium" onclick="demoLogin('tutor')">
                                    <i class="bi bi-person-badge me-2"></i> Tutor: <strong>Bintang Pratama</strong>
                                </button>
                                <button type="button" class="btn btn-outline-danger btn-sm text-start py-2 px-3 fw-medium" onclick="demoLogin('admin')">
                                    <i class="bi bi-shield-lock me-2"></i> Admin: <strong>Admin Akademik TB</strong>
                                </button>
                            </div>
                        </div>

                        <div class="position-relative text-center my-3">
                            <hr>
                            <span class="position-absolute top-50 start-50 translate-middle bg-white px-2 small text-muted">atau masuk manual</span>
                        </div>

                        <!-- Manual Form -->
                        <form onsubmit="handleManualLogin(event)">
                            <div class="mb-3">
                                <label for="loginEmail" class="form-label small fw-semibold text-secondary">Email Kampus / NIM</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
                                    <input type="text" class="form-control border-start-0 ps-0" id="loginEmail" placeholder="nama@temanbelajar.ac.id / NIM" value="20240050086" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <div class="d-flex justify-content-between">
                                    <label for="loginPassword" class="form-label small fw-semibold text-secondary">Kata Sandi</label>
                                    <a href="#" class="small text-decoration-none text-muted" onclick="alert('Pada mode demo, semua akun menggunakan kata sandi bebas atau login instan di atas!'); return false;">Lupa kata sandi?</a>
                                </div>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control border-start-0 ps-0" id="loginPassword" value="password123" required>
                                </div>
                            </div>

                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe" checked>
                                <label class="form-check-label small text-secondary" for="rememberMe">Ingat saya di perangkat ini</label>
                            </div>

                            <button type="submit" class="btn btn-tb-primary w-100 py-2 fw-semibold">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Masuk Sekarang
                            </button>
                        </form>

                        <div class="text-center mt-4 pt-3 border-top small text-secondary">
                            Belum memiliki akun mahasiswa? <a href="register.html" class="text-primary fw-semibold text-decoration-none">Daftar sekarang</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5.3 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Demo Data & Scripts -->
    <script src="assets/js/data.js"></script>
    <script src="assets/js/demo-app.js"></script>
    <script>
        function demoLogin(roleKey) {
            setActiveRole(roleKey);
            showToast('Login Berhasil', `Berhasil masuk sebagai ${roleKey.toUpperCase()}`, 'success');
            setTimeout(() => {
                if (roleKey === 'admin') window.location.href = 'admin-dashboard.html';
                else if (roleKey === 'tutor') window.location.href = 'tutor-dashboard.html';
                else window.location.href = 'student-dashboard.html';
            }, 600);
        }

        function handleManualLogin(e) {
            e.preventDefault();
            let email = document.getElementById('loginEmail').value.trim().toLowerCase();
            if (email === 'dina@temanbelajar.ac.id') email = '20240050086';
            const data = getTBData();
            const user = data.users.find(u => u.email.toLowerCase() === email || u.nim.toLowerCase() === email);

            if (user) {
                if (user.role === 'admin') setActiveRole('admin');
                else if (user.is_tutor) setActiveRole('tutor');
                else setActiveRole('student');

                showToast('Login Berhasil', `Selamat datang kembali, ${user.full_name}!`, 'success');
                setTimeout(() => {
                    if (user.role === 'admin') window.location.href = 'admin-dashboard.html';
                    else if (user.is_tutor) window.location.href = 'tutor-dashboard.html';
                    else window.location.href = 'student-dashboard.html';
                }, 600);
            } else {
                // Default to student
                setActiveRole('student');
                showToast('Login Berhasil', `Selamat datang di TemanBelajar!`, 'success');
                setTimeout(() => {
                    window.location.href = 'student-dashboard.html';
                }, 600);
            }
        }
    </script>
</body>
</html>
