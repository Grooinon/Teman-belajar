<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun Mahasiswa — TemanBelajar Demo</title>
    <meta name="description" content="Daftar akun mahasiswa TemanBelajar untuk mencari bimbingan belajar atau aktifkan mode tutor sebaya di kampus.">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom Theme Styling -->
    <link rel="stylesheet" href="assets/css/demo.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-tb sticky-top py-2">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="index.html">
                <span class="brand-logo-box">
                    <i class="bi bi-mortarboard-fill fs-5"></i>
                </span>
                <span class="text-dark fs-5 tracking-tight">Teman<span class="text-primary">Belajar</span></span>
            </a>
            <div class="d-flex align-items-center gap-2 ms-auto">
                <a href="login.html" class="btn btn-light btn-sm"><i class="bi bi-box-arrow-in-right me-1"></i> Sudah punya akun? Masuk</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1 d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="tb-card p-4 p-md-5 bg-white shadow-lg border-0">
                        <div class="text-center mb-4">
                            <span class="brand-logo-box mb-2" style="width: 48px; height: 48px;">
                                <i class="bi bi-mortarboard-fill fs-4"></i>
                            </span>
                            <h1 class="h4 fw-bold text-dark mt-2 mb-1">Daftar Akun TemanBelajar</h1>
                            <p class="text-secondary small mb-0">Satu akun fleksibel: bisa belajar sekaligus mengaktifkan mode tutor sebaya</p>
                        </div>

                        <form onsubmit="handleRegistration(event)">
                            <div class="row g-3">
                                <div class="col-12">
                                    <label for="regName" class="form-label small fw-semibold text-secondary">Nama Lengkap <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="regName" placeholder="Contoh: Rahmat Pratama" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="regNim" class="form-label small fw-semibold text-secondary">Nomor Induk Mahasiswa (NIM) <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="regNim" placeholder="Contoh: 23051214099" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="regEmail" class="form-label small fw-semibold text-secondary">Email Kampus <span class="text-danger">*</span></label>
                                    <input type="email" class="form-control" id="regEmail" placeholder="nama@temanbelajar.ac.id" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="regProgram" class="form-label small fw-semibold text-secondary">Program Studi <span class="text-danger">*</span></label>
                                    <select class="form-select" id="regProgram" required>
                                        <option value="">-- Pilih Program Studi --</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label for="regYear" class="form-label small fw-semibold text-secondary">Tahun Angkatan <span class="text-danger">*</span></label>
                                    <select class="form-select" id="regYear" required>
                                        <option value="2024">2024 (Semester 1 - 2)</option>
                                        <option value="2023" selected>2023 (Semester 3 - 4)</option>
                                        <option value="2022">2022 (Semester 5 - 6)</option>
                                        <option value="2021">2021 (Semester 7 - 8)</option>
                                    </select>
                                </div>

                                <div class="col-12">
                                    <label for="regPhone" class="form-label small fw-semibold text-secondary">Nomor WhatsApp</label>
                                    <input type="tel" class="form-control" id="regPhone" placeholder="08xxxxxxxxxx">
                                </div>

                                <div class="col-md-6">
                                    <label for="regPass" class="form-label small fw-semibold text-secondary">Kata Sandi <span class="text-danger">*</span></label>
                                    <input type="password" class="form-control" id="regPass" value="password123" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="regPassConfirm" class="form-label small fw-semibold text-secondary">Ulangi Kata Sandi <span class="text-danger">*</span></label>
                                    <input type="password" class="form-control" id="regPassConfirm" value="password123" required>
                                </div>

                                <div class="col-12">
                                    <div class="p-3 bg-light rounded-3 border">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="regAsTutor">
                                            <label class="form-check-label small fw-semibold text-dark" for="regAsTutor">
                                                <i class="bi bi-stars text-warning me-1"></i> Saya juga ingin mendaftar sebagai Tutor Sebaya
                                            </label>
                                            <div class="small text-muted mt-1" style="font-size: 0.78rem;">
                                                Anda dapat menambahkan mata kuliah yang Anda kuasai dan menetapkan jadwal rutin setelah mendaftar.
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-12">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="termsCheck" required checked>
                                        <label class="form-check-label small text-secondary" for="termsCheck">
                                            Saya menyetujui <a href="about.html#terms" class="text-primary text-decoration-none">Syarat & Ketentuan</a> serta Kode Etik Bimbingan Akademik TemanBelajar.
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-tb-primary w-100 py-3 fw-bold mt-4">
                                <i class="bi bi-person-check me-1"></i> Buat Akun Mahasiswa
                            </button>
                        </form>

                        <div class="text-center mt-4 pt-3 border-top small text-secondary">
                            Sudah memiliki akun? <a href="login.html" class="text-primary fw-semibold text-decoration-none">Masuk ke akun Anda</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5.3 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Demo Data & Scripts -->
    <script src="assets/js/data.js"></script>
    <script src="assets/js/demo-app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const data = getTBData();
            const progSelect = document.getElementById('regProgram');
            data.studyPrograms.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.textContent = `${p.name} (${p.code})`;
                progSelect.appendChild(opt);
            });
        });

        function handleRegistration(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const nim = document.getElementById('regNim').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const programId = parseInt(document.getElementById('regProgram').value, 10);
            const year = parseInt(document.getElementById('regYear').value, 10);
            const phone = document.getElementById('regPhone').value.trim();
            const isTutor = document.getElementById('regAsTutor').checked;

            const data = getTBData();
            const prog = data.studyPrograms.find(p => p.id === programId);

            const newUser = {
                id: Date.now(),
                role: 'student',
                is_tutor: isTutor,
                full_name: name,
                email: email,
                nim: nim,
                program_id: programId,
                program_name: prog ? prog.name : 'Sistem Informasi',
                graduation_year: year,
                phone: phone,
                avatar: null,
                is_active: 1
            };

            data.users.push(newUser);

            // Add activity log
            data.activityLogs.unshift({
                id: Date.now() + 1,
                user: name,
                action: 'Registrasi Pengguna Baru',
                details: `Pendaftaran akun mahasiswa ${name} (NIM: ${nim})`,
                time: 'Baru saja'
            });

            saveTBData(data);

            if (isTutor) {
                setActiveRole('tutor');
            } else {
                setActiveRole('student');
            }

            showToast('Pendaftaran Berhasil!', `Selamat datang di TemanBelajar, ${name}! Akun Anda telah aktif.`, 'success');

            setTimeout(() => {
                window.location.href = isTutor ? 'tutor-dashboard.html' : 'student-dashboard.html';
            }, 1000);
        }
    </script>
</body>
</html>
